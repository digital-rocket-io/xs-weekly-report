<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0A0E17;--surface:#131A2C;--line:#232C42;--ink:#F4F6FB;--muted:#A9B2C7;--bad:#FF6B57;--grad:linear-gradient(135deg,#4C7DFF 0%,#2BDACB 100%)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.card img{height:88px;width:auto;margin:0 auto 6px;display:block}
h1{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:20px;margin:0 0 4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 18px;color:var(--muted);font-size:13px}
label{display:block;text-align:left;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0F1524;color:var(--ink);font:inherit;font-size:15px}
input:focus{outline:2px solid #4C7DFF;outline-offset:1px}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:100px;background:var(--grad);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.remember{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin-top:12px;font-size:12px;color:var(--muted)}
.remember input{width:auto}
</style></head>

function u8(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function keyFrom(pw){var m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},m,256))}
async function open(raw,remember){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var d=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},k,u8(P.c));
  var html=new TextDecoder().decode(d);if(remember){try{localStorage.setItem(KEY,JSON.stringify({s:P.s,k:hex(raw)}))}catch(x){}}document.open();document.write(html);document.close()}
